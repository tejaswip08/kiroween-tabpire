name: Release
# Push a tag such as v0.1.0 to build the extension zips and attach them to a GitHub Release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run zip
      - run: npm run zip:firefox
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" .output/*-chrome.zip .output/*-firefox.zip --title "Tabpire $GITHUB_REF_NAME" --generate-notes
